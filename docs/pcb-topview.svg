<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <!--
    PCB top-view diagram — esp-dac-
    Board dimensions: 100 mm × 75 mm  (scale: 1 px ≈ 0.1 mm → 1000 px × 750 px board area)
    Canvas: 1200 × 1000 px with header and dimension annotations
  -->
  <defs>
    <style>
      .title  { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .sub    { font: 500 14px Arial, sans-serif; fill: #334155; }
      .lbl    { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .txt    { font: 500 12px Arial, sans-serif; fill: #1e293b; }
      .small  { font: 500 11px Arial, sans-serif; fill: #475569; }
      .dim    { font: 500 12px Arial, sans-serif; fill: #64748b; }
      .conn   { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dimln  { stroke: #94a3b8; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="1200" height="1000" fill="#f1f5f9"/>

  <!-- Title block -->
  <text x="30" y="42" class="title">esp-dac- • PCB Top View (4-layer, stereo)</text>
  <text x="30" y="66" class="sub">ESP32-S3 + TAS5825M • 100 mm × 75 mm • 12–24 V input • 24 V best-performance mode • L2 continuous GND</text>

  <!--
    Board outline
    Mapping: 100 mm → 1000 px wide, 75 mm → 750 px tall
    Origin: (100, 90) px  →  board right edge at x=1100, bottom at y=840
  -->

  <!-- PCB substrate -->
  <rect x="100" y="90" width="1000" height="750" fill="#1a3a1a" stroke="#111827" stroke-width="3" rx="6" ry="6"/>
  <!-- Board copper base hint -->
  <rect x="103" y="93" width="994" height="744" fill="#1e4620" stroke="none" rx="4" ry="4"/>

  <!-- === ZONE A: Input Protection + Buck  (0–40mm W, 0–35mm H) → x:100–500, y:90–440 === -->
  <rect x="103" y="93" width="397" height="347" fill="#7f1d1d" fill-opacity="0.55" stroke="#fca5a5" stroke-width="1.5" rx="4" ry="4"/>
  <text x="115" y="115" class="lbl" fill="#fca5a5">ZONE A — Input Protection + Buck</text>
  <!-- Input connector (left board edge) -->
  <rect x="100" y="145" width="55" height="45" fill="#991b1b" stroke="#f87171" stroke-width="1.5" rx="3" ry="3"/>
  <text x="108" y="164" class="small" fill="#fecaca">J1</text>
  <text x="104" y="179" class="small" fill="#fecaca">VIN</text>
  <!-- Protection chain -->
  <rect x="165" y="140" width="295" height="55" fill="#b91c1c" stroke="#f87171" stroke-width="1.2" rx="4" ry="4"/>
  <text x="178" y="163" class="txt" fill="#fecaca">F1 → Q1(RevPol) → D1(TVS) → L_EMI</text>
  <text x="195" y="181" class="small" fill="#fca5a5">Input protection chain (left→right)</text>
  <!-- Buck converter -->
  <rect x="130" y="215" width="200" height="80" fill="#991b1b" stroke="#f87171" stroke-width="1.5" rx="5" ry="5"/>
  <text x="148" y="244" class="lbl" fill="#fca5a5">U3 — Buck</text>
  <text x="148" y="262" class="small" fill="#fecaca">12–26V in → PVDD + 3.3V</text>
  <text x="148" y="278" class="small" fill="#fecaca">SW node tight loop</text>
  <!-- LDO 3.3V -->
  <rect x="345" y="215" width="145" height="55" fill="#991b1b" stroke="#f87171" stroke-width="1.2" rx="4" ry="4"/>
  <text x="358" y="238" class="txt" fill="#fecaca">U4 — LDO 3.3V</text>
  <text x="358" y="255" class="small" fill="#fca5a5">Digital rail</text>
  <!-- PVDD bulk caps -->
  <rect x="130" y="315" width="360" height="50" fill="#7f1d1d" stroke="#f87171" stroke-width="1" rx="3" ry="3"/>
  <text x="148" y="337" class="txt" fill="#fecaca">PVDD bulk caps (≥2×100µF + MLCC) near TAS5825M</text>
  <text x="148" y="353" class="small" fill="#fca5a5">Place on L1, via-connected to L3 PVDD pour</text>

  <!-- === ZONE B: Digital / Control  (40–100mm W, 0–35mm H) → x:500–1100, y:90–440 === -->
  <rect x="503" y="93" width="594" height="347" fill="#1e3a5f" fill-opacity="0.55" stroke="#93c5fd" stroke-width="1.5" rx="4" ry="4"/>
  <text x="515" y="115" class="lbl" fill="#93c5fd">ZONE B — Digital / Control</text>
  <!-- ESP32-S3 -->
  <rect x="515" y="130" width="245" height="155" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2" rx="6" ry="6"/>
  <text x="530" y="158" class="lbl" fill="#bfdbfe">U1 — ESP32-S3</text>
  <text x="530" y="177" class="small" fill="#dbeafe">Control • UI • I²S master</text>
  <text x="530" y="193" class="small" fill="#dbeafe">I²C → TAS5825M</text>
  <text x="530" y="209" class="small" fill="#dbeafe">SDIO → microSD</text>
  <text x="530" y="225" class="small" fill="#dbeafe">USB-C → firmware</text>
  <text x="530" y="241" class="small" fill="#dbeafe">GPIO → encoders</text>
  <text x="530" y="257" class="small" fill="#dbeafe">SPI/I²C → display</text>
  <text x="530" y="274" class="small" fill="#dbeafe">MCLK in from OSC1</text>
  <!-- Antenna keep-out marker -->
  <rect x="755" y="130" width="50" height="155" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3" rx="3" ry="3"/>
  <text x="759" y="215" class="small" fill="#fbbf24" transform="rotate(-90,762,215)">ANTENNA</text>
  <!-- microSD -->
  <rect x="820" y="130" width="180" height="55" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.2" rx="4" ry="4"/>
  <text x="835" y="153" class="txt" fill="#dbeafe">J3 — microSD (SDIO)</text>
  <text x="835" y="170" class="small" fill="#93c5fd">4-bit SDIO, length-matched</text>
  <!-- USB-C (right board edge) -->
  <rect x="1045" y="195" width="55" height="55" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5" rx="3" ry="3"/>
  <text x="1049" y="219" class="small" fill="#dbeafe">J2</text>
  <text x="1046" y="235" class="small" fill="#dbeafe">USB-C</text>
  <!-- UART header -->
  <rect x="820" y="200" width="180" height="50" fill="#1e40af" stroke="#60a5fa" stroke-width="1.2" rx="4" ry="4"/>
  <text x="835" y="223" class="txt" fill="#dbeafe">J4 — UART TX/RX Header</text>
  <text x="835" y="238" class="small" fill="#93c5fd">2.54 mm, 4-pin</text>
  <!-- I2C/GPIO header -->
  <rect x="820" y="265" width="180" height="50" fill="#1e40af" stroke="#60a5fa" stroke-width="1.2" rx="4" ry="4"/>
  <text x="835" y="288" class="txt" fill="#dbeafe">J6 — I²C/GPIO Header</text>
  <text x="835" y="303" class="small" fill="#93c5fd">Expansion header</text>
  <!-- Connection arrow ESP32 → microSD -->
  <path class="conn" d="M760 205 L820 157"/>
  <!-- Connection arrow ESP32 → USB-C -->
  <path class="conn" d="M760 230 L1045 222"/>
  <!-- Connection arrow ESP32 → UART -->
  <path class="conn" d="M760 255 L820 225"/>

  <!-- === ZONE C: Audio Power (Stereo)  (0–70mm W, 35–75mm H) → x:100–800, y:440–840 === -->
  <rect x="103" y="443" width="697" height="394" fill="#713f12" fill-opacity="0.55" stroke="#fcd34d" stroke-width="1.5" rx="4" ry="4"/>
  <text x="115" y="465" class="lbl" fill="#fcd34d">ZONE C — Audio Power (Stereo)</text>
  <!-- TAS5825M -->
  <rect x="115" y="480" width="260" height="165" fill="#92400e" stroke="#fbbf24" stroke-width="2" rx="6" ry="6"/>
  <text x="132" y="507" class="lbl" fill="#fef3c7">U2 — TAS5825M</text>
  <text x="132" y="526" class="small" fill="#fef9c3">Stereo DSP + DAC + Class-D</text>
  <text x="132" y="542" class="small" fill="#fef9c3">PVDD ≈24V local bulk + MLCC</text>
  <text x="132" y="558" class="small" fill="#fef9c3">I²S slave, I²C config</text>
  <text x="132" y="574" class="small" fill="#fef9c3">Thermal pad → via array → L4</text>
  <text x="132" y="590" class="small" fill="#fef9c3">MCLK + BCLK + LRCLK + SDIN</text>
  <text x="132" y="606" class="small" fill="#fef9c3">OUT+L / OUT–L / OUT+R / OUT–R</text>
  <!-- LC Filter Left -->
  <rect x="395" y="480" width="185" height="100" fill="#92400e" stroke="#fbbf24" stroke-width="1.5" rx="5" ry="5"/>
  <text x="412" y="504" class="lbl" fill="#fef3c7">LC Filter L</text>
  <text x="412" y="521" class="small" fill="#fef9c3">L_OUT_L ~10µH / C_OUT_L</text>
  <text x="412" y="537" class="small" fill="#fef9c3">8 Ω optimized</text>
  <text x="412" y="553" class="small" fill="#fef9c3">Adjacent to OUT+L/OUT–L</text>
  <text x="412" y="569" class="small" fill="#fef9c3">Symmetric differential layout</text>
  <!-- LC Filter Right -->
  <rect x="595" y="480" width="185" height="100" fill="#92400e" stroke="#fbbf24" stroke-width="1.5" rx="5" ry="5"/>
  <text x="612" y="504" class="lbl" fill="#fef3c7">LC Filter R</text>
  <text x="612" y="521" class="small" fill="#fef9c3">L_OUT_R ~10µH / C_OUT_R</text>
  <text x="612" y="537" class="small" fill="#fef9c3">8 Ω optimized</text>
  <text x="612" y="553" class="small" fill="#fef9c3">Adjacent to OUT+R/OUT–R</text>
  <text x="612" y="569" class="small" fill="#fef9c3">Symmetric differential layout</text>
  <!-- Connection TAS → LC L -->
  <path class="conn" d="M375 540 L395 530"/>
  <!-- Connection TAS → LC R -->
  <path class="conn" d="M375 560 L595 530"/>
  <!-- Speaker Out L (bottom board edge) -->
  <rect x="395" y="760" width="185" height="70" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" rx="4" ry="4"/>
  <text x="412" y="790" class="txt" fill="#fef3c7">J_SPK_L — Speaker Out L</text>
  <text x="412" y="808" class="small" fill="#fef9c3">8 Ω · 5mm pitch · board edge</text>
  <!-- Speaker Out R (bottom board edge) -->
  <rect x="595" y="760" width="185" height="70" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" rx="4" ry="4"/>
  <text x="612" y="790" class="txt" fill="#fef3c7">J_SPK_R — Speaker Out R</text>
  <text x="612" y="808" class="small" fill="#fef9c3">8 Ω · 5mm pitch · board edge</text>
  <!-- Connections LC → Speaker -->
  <path class="conn" d="M487 580 L487 760"/>
  <path class="conn" d="M687 580 L687 760"/>
  <!-- PVDD pour label -->
  <rect x="115" y="665" width="260" height="50" fill="#7c2d12" stroke="#f97316" stroke-width="1" rx="3" ry="3"/>
  <text x="132" y="687" class="txt" fill="#fed7aa">PVDD pour (L3) + thermal vias (L4)</text>
  <text x="132" y="703" class="small" fill="#fdba74">Low-ESR bulk at TAS5825M PVDD pins</text>

  <!-- === ZONE D: UI + Clock  (70–100mm W, 35–75mm H) → x:800–1100, y:440–840 === -->
  <rect x="803" y="443" width="294" height="394" fill="#14532d" fill-opacity="0.55" stroke="#86efac" stroke-width="1.5" rx="4" ry="4"/>
  <text x="815" y="465" class="lbl" fill="#86efac">ZONE D — UI + Clock</text>
  <!-- Display connector (right board edge) -->
  <rect x="815" y="480" width="265" height="60" fill="#166534" stroke="#4ade80" stroke-width="1.5" rx="4" ry="4"/>
  <text x="830" y="504" class="lbl" fill="#dcfce7">J5 — Display (SPI/I²C)</text>
  <text x="830" y="520" class="small" fill="#bbf7d0">Header · front-panel edge</text>
  <!-- Encoder 1 -->
  <rect x="815" y="555" width="75" height="85" fill="#15803d" stroke="#4ade80" stroke-width="1.2" rx="5" ry="5"/>
  <text x="827" y="583" class="txt" fill="#dcfce7">ENC1</text>
  <text x="820" y="600" class="small" fill="#bbf7d0">+ PUSH</text>
  <text x="822" y="614" class="small" fill="#86efac">Vol</text>
  <!-- Encoder 2 -->
  <rect x="905" y="555" width="75" height="85" fill="#15803d" stroke="#4ade80" stroke-width="1.2" rx="5" ry="5"/>
  <text x="917" y="583" class="txt" fill="#dcfce7">ENC2</text>
  <text x="910" y="600" class="small" fill="#bbf7d0">+ PUSH</text>
  <text x="913" y="614" class="small" fill="#86efac">Trk</text>
  <!-- Encoder 3 -->
  <rect x="995" y="555" width="75" height="85" fill="#15803d" stroke="#4ade80" stroke-width="1.2" rx="5" ry="5"/>
  <text x="1007" y="583" class="txt" fill="#dcfce7">ENC3</text>
  <text x="1000" y="600" class="small" fill="#bbf7d0">+ PUSH</text>
  <text x="1003" y="614" class="small" fill="#86efac">EQ</text>
  <!-- Oscillator + LDO -->
  <rect x="815" y="655" width="265" height="80" fill="#166534" stroke="#4ade80" stroke-width="1.5" rx="5" ry="5"/>
  <text x="830" y="678" class="lbl" fill="#dcfce7">OSC1 — 24.576 MHz TCXO</text>
  <text x="830" y="697" class="small" fill="#bbf7d0">Low-jitter · isolated clock domain</text>
  <text x="830" y="713" class="small" fill="#bbf7d0">U5 LDO VDD_CLK adjacent</text>
  <!-- MCLK connection label -->
  <rect x="815" y="750" width="265" height="50" fill="#14532d" stroke="#4ade80" stroke-width="1" rx="3" ry="3"/>
  <text x="830" y="773" class="txt" fill="#86efac">MCLK → ESP32-S3 + TAS5825M</text>
  <text x="830" y="789" class="small" fill="#6ee7b7">Short trace · L1 · continuous L2 below</text>

  <!-- === CONNECTIONS between zones === -->
  <!-- Buck → TAS5825M PVDD -->
  <path class="conn" d="M245 295 L245 480"/>
  <!-- ESP32-S3 I2S → TAS5825M -->
  <path class="conn" d="M515 340 L375 540"/>
  <!-- ESP32-S3 I2C → TAS5825M -->
  <path class="conn" d="M515 360 L375 560"/>
  <!-- OSC1 MCLK → ESP32-S3 -->
  <path class="conn" d="M815 695 L760 350"/>
  <!-- ESP32-S3 → Display -->
  <path class="conn" d="M760 280 L815 510"/>
  <!-- ESP32-S3 → Encoders -->
  <path class="conn" d="M760 310 L852 555"/>

  <!-- === MOUNTING HOLES (M3, 3.2mm) at corners === -->
  <!-- MH1: top-left (3mm, 3mm) = (130, 120) -->
  <circle cx="130" cy="120" r="16" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="130" cy="120" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="152" y="116" class="small" fill="#94a3b8">MH1</text>
  <!-- MH2: top-right (97mm, 3mm) = (1070, 120) -->
  <circle cx="1070" cy="120" r="16" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="1070" cy="120" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="1078" y="116" class="small" fill="#94a3b8">MH2</text>
  <!-- MH3: bottom-left (3mm, 72mm) = (130, 810) -->
  <circle cx="130" cy="810" r="16" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="130" cy="810" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="152" y="806" class="small" fill="#94a3b8">MH3</text>
  <!-- MH4: bottom-right (97mm, 72mm) = (1070, 810) -->
  <circle cx="1070" cy="810" r="16" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="1070" cy="810" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="1078" y="806" class="small" fill="#94a3b8">MH4</text>

  <!-- === DIMENSION ANNOTATIONS === -->
  <!-- Width dimension (100 mm) -->
  <line x1="100" y1="868" x2="1100" y2="868" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="100" y1="843" x2="100" y2="878" class="dimln"/>
  <line x1="1100" y1="843" x2="1100" y2="878" class="dimln"/>
  <text x="570" y="886" class="dim" text-anchor="middle">100 mm</text>

  <!-- Height dimension (75 mm) -->
  <line x1="35" y1="90" x2="35" y2="840" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="60" y1="90" x2="25" y2="90" class="dimln"/>
  <line x1="60" y1="840" x2="25" y2="840" class="dimln"/>
  <text x="22" y="465" class="dim" text-anchor="middle" transform="rotate(-90,22,465)">75 mm</text>

  <!-- === LEGEND / NOTES === -->
  <text x="100" y="920" class="small">Layer 2 rule: L2 must remain a continuous uncut GND plane across the full 100×75 mm board — no splits, no power pours on L2.</text>
  <text x="100" y="938" class="small">Clock domain: OSC1 + LDO physically isolated from buck SW node and class-D outputs. MCLK trace &lt; 20 mm, L1 top, solid L2 reference beneath.</text>
  <text x="100" y="956" class="small">Prototype: 100 mm × 75 mm · 4-layer · M3 mounting holes at corners · Speaker and USB-C connectors at board edges.</text>
  <text x="100" y="974" class="small">Zone boundaries are placement guides — final positions per schematic and routing efficiency. Verified against pcb-layout-checklist.md before Gerber export.</text>
</svg>
