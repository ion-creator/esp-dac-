<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 16px Arial, sans-serif; fill: #334155; }
      .lbl { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .txt { font: 500 13px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 12px Arial, sans-serif; fill: #475569; }
      .zone { stroke: #1f2937; stroke-width: 2; rx: 14; ry: 14; }
      .conn { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>
  <text x="40" y="50" class="title">esp-dac- • Initial PCB Top View (4-layer, stereo)</text>
  <text x="40" y="78" class="sub">ESP32-S3 + TAS5825M • 12–24 V input • 24 V best-performance mode • L2 continuous GND</text>

  <rect x="30" y="110" width="1340" height="760" fill="#ffffff" stroke="#111827" stroke-width="3" rx="20" ry="20"/>

  <rect x="60" y="140" width="360" height="220" class="zone" fill="#fee2e2"/>
  <text x="80" y="170" class="lbl">Input + Protection + Buck</text>
  <text x="80" y="195" class="txt">VIN 12–24V</text>
  <text x="80" y="218" class="small">FUSE → RevPol MOSFET → TVS → EMI</text>
  <text x="80" y="241" class="small">Buck converter + power distribution</text>
  <text x="80" y="264" class="small">Keep SW loop tight in this corner</text>

  <rect x="450" y="140" width="500" height="300" class="zone" fill="#dbeafe"/>
  <text x="470" y="170" class="lbl">Digital / Control Zone</text>
  <rect x="480" y="190" width="220" height="120" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5" rx="10" ry="10"/>
  <text x="495" y="220" class="lbl">ESP32-S3</text>
  <text x="495" y="243" class="small">Control • UI • SDIO • USB</text>
  <text x="495" y="266" class="small">I²S + I²C to TAS5825M</text>
  <rect x="720" y="190" width="200" height="55" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" rx="8" ry="8"/>
  <text x="735" y="223" class="txt">microSD (SDIO)</text>
  <rect x="720" y="255" width="200" height="55" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" rx="8" ry="8"/>
  <text x="735" y="288" class="txt">USB-C (program/update)</text>
  <rect x="720" y="320" width="200" height="55" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" rx="8" ry="8"/>
  <text x="735" y="353" class="txt">UART Header (TX/RX)</text>

  <rect x="980" y="140" width="360" height="300" class="zone" fill="#dcfce7"/>
  <text x="1000" y="170" class="lbl">UI + Clock Zone</text>
  <rect x="1010" y="190" width="310" height="70" fill="#bbf7d0" stroke="#166534" stroke-width="1.5" rx="10" ry="10"/>
  <text x="1025" y="218" class="lbl">Display (SPI/I²C)</text>
  <text x="1025" y="240" class="small">Place near board edge / front panel</text>

  <rect x="1010" y="275" width="95" height="85" fill="#bbf7d0" stroke="#166534" stroke-width="1.2" rx="10" ry="10"/>
  <text x="1023" y="307" class="txt">ENC1</text>
  <text x="1018" y="329" class="small">+ PUSH</text>
  <rect x="1118" y="275" width="95" height="85" fill="#bbf7d0" stroke="#166534" stroke-width="1.2" rx="10" ry="10"/>
  <text x="1131" y="307" class="txt">ENC2</text>
  <text x="1126" y="329" class="small">+ PUSH</text>
  <rect x="1226" y="275" width="95" height="85" fill="#bbf7d0" stroke="#166534" stroke-width="1.2" rx="10" ry="10"/>
  <text x="1239" y="307" class="txt">ENC3</text>
  <text x="1234" y="329" class="small">+ PUSH</text>

  <rect x="980" y="375" width="360" height="65" fill="#bbf7d0" stroke="#166534" stroke-width="1.2" rx="10" ry="10"/>
  <text x="1000" y="412" class="txt">24.576 MHz low-jitter oscillator + low-noise LDO</text>

  <rect x="60" y="390" width="890" height="320" class="zone" fill="#fef3c7"/>
  <text x="80" y="420" class="lbl">Audio Power Zone (Stereo)</text>
  <rect x="90" y="445" width="350" height="130" fill="#fde68a" stroke="#92400e" stroke-width="1.5" rx="10" ry="10"/>
  <text x="110" y="475" class="lbl">TAS5825M</text>
  <text x="110" y="500" class="small">Stereo DSP + DAC + Class-D (L/R)</text>
  <text x="110" y="523" class="small">PVDD ≈24V with local bulk + MLCC</text>
  <text x="110" y="546" class="small">I²S slave, I²C control</text>

  <rect x="470" y="445" width="220" height="120" fill="#fde68a" stroke="#92400e" stroke-width="1.2" rx="10" ry="10"/>
  <text x="490" y="475" class="txt">LC Filter Left</text>
  <text x="490" y="498" class="small">8 Ω optimized</text>
  <text x="490" y="521" class="small">Place next to OUTL pins</text>

  <rect x="710" y="445" width="220" height="120" fill="#fde68a" stroke="#92400e" stroke-width="1.2" rx="10" ry="10"/>
  <text x="730" y="475" class="txt">LC Filter Right</text>
  <text x="730" y="498" class="small">8 Ω optimized</text>
  <text x="730" y="521" class="small">Place next to OUTR pins</text>

  <rect x="470" y="590" width="220" height="90" fill="#fde68a" stroke="#92400e" stroke-width="1.2" rx="10" ry="10"/>
  <text x="490" y="625" class="txt">Speaker Out L</text>
  <text x="490" y="648" class="small">8 Ω load</text>

  <rect x="710" y="590" width="220" height="90" fill="#fde68a" stroke="#92400e" stroke-width="1.2" rx="10" ry="10"/>
  <text x="730" y="625" class="txt">Speaker Out R</text>
  <text x="730" y="648" class="small">8 Ω load</text>

  <path class="conn" d="M420 250 L450 250"/>
  <path class="conn" d="M700 250 L720 217"/>
  <path class="conn" d="M700 250 L720 282"/>
  <path class="conn" d="M700 250 L720 347"/>
  <path class="conn" d="M950 250 L980 407"/>
  <path class="conn" d="M650 440 L440 510"/>
  <path class="conn" d="M440 510 L470 505"/>
  <path class="conn" d="M440 510 L710 505"/>
  <path class="conn" d="M690 505 L690 635"/>
  <path class="conn" d="M820 505 L820 635"/>

  <text x="65" y="835" class="small">Layout intent: stereo L/R outputs, 3 encoders with push, display interface, UART TX/RX expansion, compact 4-layer implementation.</text>
  <text x="65" y="858" class="small">Critical rule: keep Layer 2 as continuous GND plane and isolate clock/display/control from class-D switching nodes.</text>
</svg>
